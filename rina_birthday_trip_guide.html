<html lang="en">
<head>

<style>
:root{--bg:#f8f5f0;--paper:#fffaf2;--ink:#171717;--muted:#5f6470;--line:#e1d7c8;--gold:#c9912b;--blue:#17324b;}
*{box-sizing:border-box} html,body{height:100%;margin:0} body{font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.35;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
.top{flex:0 0 auto;background:linear-gradient(135deg,#171717,#47321a 60%,#8a6428);color:white;padding:12px 18px 10px;box-shadow:0 2px 12px rgba(0,0,0,.18);z-index:10}
.top-row{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(20px,2.5vw,34px);margin:0;line-height:1.05} .subtitle{font-size:13px;color:#f7e6c7;margin-top:3px}
.tabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 2px;scrollbar-width:thin}
.tabs button{border:0;color:white;border-radius:999px;padding:9px 14px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:none;flex:0 0 auto}
.tabs button.active{outline:3px solid rgba(255,255,255,.65);box-shadow:0 3px 10px rgba(0,0,0,.25);transform:translateY(-1px)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,43%) minmax(420px,57%);gap:0}
.panel{min-height:0;overflow:hidden;border-right:1px solid var(--line);background:linear-gradient(180deg,#fffaf2,#fff7ec)}
.content{height:100%;overflow:auto;padding:18px 20px 24px}
.mapwrap{min-height:0;padding:18px;background:#fffdf8;display:flex;flex-direction:column;gap:10px}
#map{flex:1;min-height:0;border-radius:18px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.mapnote{font-size:12px;color:var(--muted);margin:0}
.day-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 5px rgba(0,0,0,.08)} h2{font-size:clamp(22px,3vw,30px);margin:0} .badge{background:#eef0f4;border-radius:999px;padding:4px 10px;font-size:13px;color:#1d2733}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.timeline{border-left:3px solid #e0d3bd;margin-left:8px;padding-left:17px} .event{margin:12px 0} .time{font-weight:900;color:#6a4612;margin-bottom:2px}
.sidegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px} .info{border-left:4px solid var(--gold);padding:10px 12px;background:#fff;border-radius:12px} .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;margin-bottom:4px}
.btn{display:inline-block;background:#174d7a;color:white;text-decoration:none;border-radius:999px;padding:10px 14px;font-weight:800;margin-top:10px}
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .overview-day{cursor:pointer} .overview-day b{display:block} .overview-day span{font-size:13px;color:var(--muted)}
.rules{font-size:14px} ul{margin:8px 0 0 22px;padding:0} li{margin:4px 0}
.cluster{display:grid;grid-template-columns:1fr 1fr;gap:10px} ol{margin:8px 0 0 22px;padding:0} .small{font-size:12px;color:var(--muted)}
/* Leaflet fallback CSS in case CDN CSS is blocked */

@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100dvh}.top{position:sticky;top:0}.main{display:flex;flex-direction:column}.mapwrap{order:1;height:45dvh;min-height:330px;padding:12px}.panel{order:2;border-right:0}.content{height:auto;overflow:visible;padding:14px}.sidegrid,.cluster,.overview-grid{grid-template-columns:1fr}}
@media(max-width:520px){.top{padding:10px 12px}.tabs button{padding:8px 11px;font-size:13px}.mapwrap{height:42dvh;min-height:300px}.content{font-size:15px}}
@media print{body{overflow:visible;background:white}.app{height:auto}.top{position:relative}.main{display:block}.mapwrap{height:420px}.panel,.content{overflow:visible}}
</style>
</head>
<body><div class="app">

0 AM–5:30 PM", "Adults choose low-key Pasadena, Americana at Brand, Descanso Gardens, or hotel rest."], ["7:00 PM", "Pick up Rina. Easy dinner."]], "sidebar": {"Reservations": "None for Forest Lawn. Descanso/Huntington if chosen.", "Parking": "Forest Lawn has on-site parking.", "Photo": "Grounds where permitted.", "Comfort": "★★★★★ Keep it reflective, not rushed."}}, "Sunday 8/30": {"theme": "Universal Studio Tour", "color": "#e66100", "pace": "Moderate", "stops": ["Embassy Suites Glendale", "Aspens Place Recording", "Universal Studios Hollywood", "Embassy Suites Glendale", "Aspens Place Recording", "Embassy Suites Glendale"], "schedule": [["7:30–8:30 AM", "Breakfast."], ["9:30 AM", "Drop Rina at Aspen."], ["11:15 AM–3:30 PM", "Universal Studios Hollywood: prioritize the Studio Tour; add WaterWorld or shows if energy allows."], ["3:45–6:00 PM", "Return to hotel to rest."], ["7:00 PM", "Pick up Rina. Dinner close by."]], "sidebar": {"Reservations": "Buy Universal tickets in advance. Express not necessary unless group wants rides.", "Parking": "General parking is adequate.", "Photo": "Universal globe.", "Comfort": "★★★★☆ Studio Tour is tram-based; park has more walking."}}, "Monday 8/31": {"theme": "Journey to Neverland", "color": "#d1242f", "pace": "Moderate / long drive", "stops": ["Embassy Suites Glendale", "Hayvenhurst Gates (optional)", "neverland valley ranch gates", "Solvang", "Embassy Suites Glendale"], "schedule": [["7:00 AM", "Breakfast. Pack water/snacks."], ["7:45 AM", "Depart Glendale. Optional 5–10 min Hayvenhurst drive-by only if Grandma wants it."], ["Late morning", "Neverland Valley Ranch gates. Let Rina set the pace."], ["12:30–2:30 PM", "Solvang lunch, short walk, bakery/ice cream."], ["5:30–6:30 PM", "Return to Glendale. Relaxed dinner."]], "sidebar": {"Reservations": "None. Lunch reservation optional in Solvang.", "Parking": "Neverland is a quick roadside/photo stop; be respectful of private property.", "Photo": "Neverland gates, Solvang windmills.", "Comfort": "★★★☆☆ Long car day; flat, easy walking in Solvang."}}, "Tuesday 9/1": {"theme": "Michael’s Hollywood + Pacific Finale", "color": "#0086c9", "pace": "Easy–Moderate", "stops": ["Embassy Suites Glendale", "GRAMMY Museum", "Palace Theatre", "Monte Carlo Cafe", "Stranger in Moscow street", "1038 Venice Blvd.", "Michael Jackson Off The Wall Album cover location", "Michael Jackson star", "TCL Chinese Theatre - MJ Handprints", "Thriller Dance Break", "Fisherman's Village / Marina del Rey", "Embassy Suites Glendale"], "schedule": [["9:30 AM", "Depart Glendale for GRAMMY Museum."], ["10:15 AM–12:30 PM", "GRAMMY Museum."], ["12:30–2:30 PM", "Downtown/Westlake MJ photo stops: Palace Theatre, Monte Carlo, Stranger in Moscow, 1038 Venice Blvd."], ["2:45–4:00 PM", "Hollywood cluster: MJ Star + TCL Chinese Theatre handprints; Off the Wall location if timing works."], ["4:00–5:00 PM", "Drive to Fisherman’s Village / Marina del Rey."], ["5:00–sunset", "Sea lions, harbor walk, Pacific finale, waterfront birthday dinner."]], "sidebar": {"Reservations": "GRAMMY tickets. Dinner reservation on the water.", "Parking": "Use nearby LA Live parking for GRAMMY; Hollywood & Highland/Ovation for Hollywood cluster.", "Photo": "MJ Star, handprints, marina sea lions, sunset.", "Comfort": "★★★★☆ Several short stops; can trim outlier stops if tired."}}};

const dayOrder=Object.keys(days);
const pointByName=Object.fromEntries(points.map(p=>[p.name,p]));
let map, markers=[], lines=[];
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function initTabs(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML='';
  const makeBtn=(label,day,color)=>{
    const b=document.createElement('button');
    b.type='button';
    b.dataset.day=day;
    b.textContent=label;
    b.style.background=color;
    b.addEventListener('click',()=>selectDay(day));
    tabs.appendChild(b);
  };
  makeBtn('Overview','all','#17324b');
  dayOrder.forEach(d=>makeBtn(d.split(' ')[0],d,days[d].color));

function markerIcon(color){return L.divIcon({className:'',html:`<div style="background:${color};width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 2px 7px #333"></div>`,iconSize:[18,18],iconAnchor:[9,9]});}
function draw(day){if(!map) return; markers.forEach(m=>map.removeLayer(m)); lines.forEach(l=>map.removeLayer(l)); markers=[]; lines=[]; let bounds=[]; const show=day==='all'?points:points.filter(p=>p.days.includes(day)); show.forEach(p=>{const color=day==='all'?p.color:days[day].color; const m=L.marker([p.lat,p.lon],{icon:markerIcon(color)}).addTo(map).bindPopup(`<b>${esc(p.name)} </b><br>${p.days.map(esc).join('<br>')||'Reference'}<br><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}">Open in Google Maps</a>`); markers.push(m); bounds.push([p.lat,p.lon]);}); if(day!=='all'){let pts=days[day].stops.map(n=>pointByName[n]).filter(Boolean).map(p=>[p.lat,p.lon]); if(pts.length>1){lines.push(L.polyline(pts,{color:days[day].color,weight:4,opacity:.75,dashArray:'7,8'}).addTo(map)); bounds=pts;}} if(bounds.length) map.fitBounds(bounds,{padding:[35,35]}); setTimeout(()=>map.invalidateSize(),80);}

function initMap(){if(!window.L){document.getElementById('map').innerHTML='<div style="padding:20px">Map library did not load. Route buttons still open Google Maps.</div>'; return;} map=L.map('map').setView([34.08,-118.35],9); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);}
initTabs(); initMap(); selectDay('all');
