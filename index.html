const dayOrder=Object.keys(days);
const pointByName=Object.fromEntries(points.map(p=>[p.name,p]));
let map, markers=[], lines=[];

function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function initTabs(){
 const tabs=document.getElementById('tabs'); tabs.innerHTML='';
 const makeBtn=(label,day,color)=>{const b=document.createElement('button');b.type='button';b.dataset.day=day;b.textContent=label;b.style.background=color;b.addEventListener('click',()=>selectDay(day));tabs.appendChild(b);};
 makeBtn('Overview','all','#17324b');
 dayOrder.forEach(d=>makeBtn(d.replace(/\s\d+\/\d+$/,''),d,days[d].color));
}
function markerIcon(color,label=null){
 const txt=label===null?'':String(label);
 const size=label===null?18:26;
 const font=label===null?0:12;
 return L.divIcon({
   className:'',
   html:`<div style="background:${color};width:${size}px;height:${size}px;border-radius:50%;border:3px solid white;box-shadow:0 2px 7px #333;color:white;font-weight:900;font-size:${font}px;display:flex;align-items:center;justify-content:center;line-height:1">${txt}</div>`,
   iconSize:[size,size],
   iconAnchor:[size/2,size/2]
 });
}
function draw(day){
 if(!map) return;
 markers.forEach(m=>map.removeLayer(m)); lines.forEach(l=>map.removeLayer(l)); markers=[]; lines=[];
 let bounds=[];
 if(day==='all'){
   points.forEach(p=>{
     const m=L.marker([p.lat,p.lon],{icon:markerIcon(p.color)}).addTo(map)
       .bindPopup(`<b>${esc(p.name)}</b><br>${p.days.map(esc).join('<br>')||'Reference'}<br><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}">Open in Google Maps</a>`);
     markers.push(m); bounds.push([p.lat,p.lon]);
   });
 } else {
   const orderedStops=days[day].stops.map(n=>pointByName[n]).filter(Boolean);
   orderedStops.forEach((p,i)=>{
     const m=L.marker([p.lat,p.lon],{icon:markerIcon(days[day].color,i+1)}).addTo(map)
       .bindPopup(`<b>${i+1}. ${esc(p.name)}</b><br>${esc(day)}<br><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}">Open in Google Maps</a>`);
     markers.push(m); bounds.push([p.lat,p.lon]);
   });
   const pts=orderedStops.map(p=>[p.lat,p.lon]);
   if(pts.length>1) lines.push(L.polyline(pts,{color:days[day].color,weight:4,opacity:.75,dashArray:'7,8'}).addTo(map));
 }
 if(bounds.length) map.fitBounds(bounds,{padding:[35,35]}); setTimeout(()=>map.invalidateSize(),80);
}

 <p>The trip now runs from Los Angeles into Las Vegas. The dates below are the corrected anchors.</p>

 <div class="card rules"><b>Locked corrections & priorities</b><ul>
 <li><b>Fri Aug 28:</b> Dinner with Mark after Rina pickup, target 7:45–8:00 PM; location TBD; <b>back at the hotel before 11 PM</b>.</li><li><b>Mon Aug 31:</b> GRAMMY Museum + the <b>full original Michael Hollywood route</b>. Horror escape remains optional, with <b>The Basement favored</b>.</li>

 </ul></div>

}

function dayHtml(day){

 let protectedStops='';

   protectedStops=`<div class="card"><b>Restored from the original itinerary — do not drop these</b>
   <div class="split"><div><div class="label">Downtown / Westlake MJ cluster</div><ul>
   <li>Palace Theatre</li><li>Monte Carlo Cafe</li><li>Stranger in Moscow street</li><li>1038 Venice Blvd. — The Graff Lab / Michael Jackson murals</li><li>Thriller Dance Break (optional outlier)</li>

   </ul></div></div>
   <p class="small">Fisherman's Village / Marina del Rey is also preserved as a flex stop. If the day is too full, remove the optional horror room or marina before removing the core Michael locations.</p></div>`;
 }
 return `<div class="day-head"><span class="dot" style="background:${d.color}"></span><h2>${day} — ${esc(d.theme)}</h2><span class="badge">Pace: ${esc(d.pace)}</span></div>
 <div class="timeline">${events}</div>
 <a class="btn" target="_blank" rel="noopener" href="${routeLinks[day]}">Open rough route in Google Maps</a>
 <div class="sidegrid">${sidebar}</div>${protectedStops}${sourcesHtml(day)}`;
}
function selectDay(day){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.day===day));document.getElementById('content').innerHTML=day==='all'?overviewHtml():dayHtml(day);draw(day);}
function initMap(){if(!window.L){document.getElementById('map').innerHTML='<div style="padding:20px">Map library did not load. Route buttons still open Google Maps.</div>';return;}map=L.map('map').setView([35,-117],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);}
initTabs();initMap();selectDay('all');
